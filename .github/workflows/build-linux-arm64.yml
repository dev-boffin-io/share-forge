name: Build Linux arm64

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: 🐧 Linux arm64 Build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 \
            libglib2.0-0 libgl1 libegl1 libdbus-1-3

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask werkzeug
          pip install pyqt6 pyqt6-qt6 pyqt6-sip
          pip install pyinstaller

      - name: 🔨 Build GUI binary (share-forge)
        run: |
          pyinstaller \
            --onefile \
            --name "share-forge" \
            --windowed \
            --collect-all PyQt6 \
            --collect-all flask \
            --collect-all werkzeug \
            --add-data "core:core" \
            --add-data "gui:gui" \
            main.py

      - name: 🔨 Build CLI binary (share-forge-cli)
        run: |
          pyinstaller \
            --onefile \
            --name "share-forge-cli" \
            --collect-all flask \
            --collect-all werkzeug \
            --add-data "core:core" \
            cli/main.py

      - name: 📦 Collect binaries
        run: |
          mkdir -p bin
          mv dist/share-forge     bin/share-forge-linux-arm64
          mv dist/share-forge-cli bin/share-forge-cli-linux-arm64
          chmod +x bin/*

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: share-forge-linux-arm64
          path: bin/
          retention-days: 30

  release:
    name: 🚀 GitHub Release
    needs: build-linux-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: share-forge-linux-arm64
          path: bin/

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/**
          generate_release_notes: true
