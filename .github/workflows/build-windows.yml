name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # হাতে trigger করার জন্য

jobs:
  # ──────────────────────────────────────────
  # GUI + CLI — Windows .exe
  # ──────────────────────────────────────────
  build-windows:
    name: 🪟 Windows Build
    runs-on: windows-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 🔨 Build GUI binary (share-forge.exe)
        run: |
          pyinstaller `
            --onefile `
            --name "share-forge" `
            --windowed `
            --add-data "core;core" `
            --add-data "gui;gui" `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import flask `
            --hidden-import werkzeug `
            main.py

      - name: 🔨 Build CLI binary (share-forge-cli.exe)
        run: |
          pyinstaller `
            --onefile `
            --name "share-forge-cli" `
            --add-data "core;core" `
            --hidden-import flask `
            --hidden-import werkzeug `
            cli/main.py

      - name: 📁 Collect binaries
        run: |
          mkdir bin
          move dist\share-forge.exe     bin\share-forge.exe
          move dist\share-forge-cli.exe bin\share-forge-cli.exe

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: share-forge-windows
          path: bin/
          retention-days: 30

  # ──────────────────────────────────────────
  # Release — শুধু tag push করলে চলবে
  # ──────────────────────────────────────────
  release:
    name: 🚀 GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: share-forge-windows
          path: bin/

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/share-forge.exe
            bin/share-forge-cli.exe
          generate_release_notes: true
