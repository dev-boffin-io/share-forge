name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: 🪟 Windows Build
    runs-on: windows-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask werkzeug
          pip install pyqt6 pyqt6-qt6 pyqt6-sip
          pip install pyinstaller

      - name: 🔨 Build GUI (share-forge folder)
        run: |
          pyinstaller `
            --onedir `
            --name "share-forge" `
            --windowed `
            --collect-all PyQt6 `
            --collect-all flask `
            --collect-all werkzeug `
            --add-data "core;core" `
            --add-data "gui;gui" `
            main.py

      - name: 🔨 Build CLI (share-forge-cli folder)
        run: |
          pyinstaller `
            --onedir `
            --name "share-forge-cli" `
            --collect-all flask `
            --collect-all werkzeug `
            --add-data "core;core" `
            cli/main.py

      - name: 📦 Zip outputs
        run: |
          Compress-Archive -Path dist\share-forge     -DestinationPath dist\share-forge.zip
          Compress-Archive -Path dist\share-forge-cli -DestinationPath dist\share-forge-cli.zip

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: share-forge-windows
          path: |
            dist/share-forge.zip
            dist/share-forge-cli.zip
          retention-days: 30

  release:
    name: 🚀 GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: share-forge-windows
          path: dist/

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/share-forge.zip
            dist/share-forge-cli.zip
          generate_release_notes: true
