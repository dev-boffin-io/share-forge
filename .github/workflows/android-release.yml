name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-release.yml"
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ platform folder is generated, not checked in
      # (gradle-wrapper.jar is binary and shouldn't live in git by hand).
      - name: Ensure android platform scaffold exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org io.github.devboffin --project-name share_forge .
          fi

      # flutter create only adds INTERNET permission to the DEBUG manifest
      # (needed for the Dart VM debug service) — the release/main manifest
      # ships without it, so a release build would have no network access
      # at all, which would be fatal for an app whose whole job is serving
      # HTTP.
      - name: Add required permissions to the release manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for perm in \
            "android.permission.INTERNET" \
            "android.permission.ACCESS_WIFI_STATE" \
            "android.permission.ACCESS_NETWORK_STATE" \
            "android.permission.FOREGROUND_SERVICE" \
            "android.permission.FOREGROUND_SERVICE_DATA_SYNC" \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.WAKE_LOCK" \
            "android.permission.MANAGE_EXTERNAL_STORAGE"; do
            grep -q "$perm" "$MANIFEST" || \
              sed -i "s#<application#<uses-permission android:name=\"$perm\" />\n\n    <application#" "$MANIFEST"
          done
          cat "$MANIFEST"

      # flutter_foreground_task needs its service declared explicitly.
      - name: Register foreground service in the manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'flutter_foreground_task.service.ForegroundService' "$MANIFEST" || \
            sed -i 's#</application>#    <service\n        android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n        android:foregroundServiceType="dataSync"\n        android:exported="false" />\n\n</application>#' "$MANIFEST"
          cat "$MANIFEST"

      # flutter_plugin_android_lifecycle (pulled in transitively by
      # file_picker) requires compileSdk 36+.
      # 1) local.properties' flutter.compileSdkVersion covers the app
      #    module (read via the flutter.compileSdkVersion extension).
      # 2) Plugin subprojects like file_picker's own android/build.gradle
      #    do NOT read that — force compileSdk on every Android library
      #    subproject directly instead.
      - name: Pin flutter.compileSdkVersion to 36
        run: |
          printf '\n' >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          cat android/local.properties

      - name: Force compileSdk 36 on all Android library subprojects
        run: |
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              val forceCompileSdk36 = {
                  extensions.findByType<com.android.build.gradle.LibraryExtension>()?.let {
                      it.compileSdk = 36
                  }
              }
              if (state.executed) forceCompileSdk36() else afterEvaluate { forceCompileSdk36() }
          }
          EOF
          cat android/build.gradle.kts

      - run: flutter pub get

      - name: Generate launcher icon from assets/icon/icon.png
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: share-forge-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
